<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descanso · Panel Administrativo</title>
  <meta name="description" content="Plataforma administrativa para gestionar finanzas, inventario y ventas de un emprendimiento de productos para el descanso en Venezuela." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>" />
</head>
<body>
  <!-- ===== LOGIN ===== -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-brand"><span class="logo-moon">🌙</span> Descanso<span class="logo-dot">.</span></div>
      <p class="login-sub">Panel administrativo del emprendimiento</p>
      <label class="field">
        <span>Usuario</span>
        <select id="login-user"></select>
      </label>
      <label class="field">
        <span>Contraseña <em>(demo: 1234)</em></span>
        <input id="login-pass" type="password" value="1234" autocomplete="off" />
      </label>
      <button id="login-btn" class="btn btn-primary btn-block">Entrar</button>
      <p class="login-hint">Administrador: control total · Colaborador: registra ventas e inventario.</p>
    </div>
  </div>

  <!-- ===== APP SHELL ===== -->
  <div id="app" class="app hidden">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="logo-moon">🌙</span>
        <span class="brand-text">Descanso<span class="logo-dot">.</span></span>
      </div>
      <nav class="nav" id="main-nav"></nav>
      <div class="sidebar-user" id="sidebar-user"></div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Menú">☰</button>
        <div class="global-search">
          <span class="search-icon">🔎</span>
          <input id="global-search" type="search" placeholder="Buscar productos, ventas, proveedores…" />
          <div id="search-results" class="search-results hidden"></div>
        </div>
        <div class="topbar-rates" id="topbar-rates"></div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <!-- Modal host -->
  <div id="modal-root"></div>
  <!-- Toast host -->
  <div id="toast-root" class="toast-root"></div>

  <!-- Scripts (orden importante, sin build) -->
  <script src="js/store.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
